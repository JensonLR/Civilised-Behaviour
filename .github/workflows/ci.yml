name: CI
on:
  push:
    branches: ["**"]
  pull_request:

# One run per branch (push) and per pull request at a time: a newer push cancels the run it supersedes. Without this, three pushes in ten minutes kept six full runs
# (check and e2e each) on the runners at once and every one of them crawled. A push run and a pull-request run of the same commit are separate groups and both finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # D-036: named explicitly so a failure points at the right package (they also run inside `pnpm test` / `pnpm build`)
      - run: pnpm --filter @cb/desktop typecheck
      - run: pnpm --filter @cb/website test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/
