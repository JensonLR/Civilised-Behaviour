<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the HUD and the touch controls keep clear of a notch through env(safe-area-inset-*); the page is a game, not a document, so a double tap never zooms (touch-action in the CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Civilised Behaviour - a 1-4 player co-op satirical expedition game." />
    <title>Civilised Behaviour</title>
    <!-- the Society's seal (D-053): files generated from the palette by scripts/icons.mts. Safari's favourites and home screen read the touch icon, Android the manifest -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Civilised" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/plate.css" />
  </head>
  <body>
    <canvas id="stage" tabindex="0"></canvas>
    <div id="hud" hidden></div>
    <div id="menu"></div>
    <pre id="debug" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
