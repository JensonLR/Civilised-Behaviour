# Render Blueprint (reference only, NOT synced: the services were created via the Render API/MCP on the free plan).
# Names match the live play-link pair (docs/DEPLOYMENT.md); keep this file in sync if settings change. Free web services spin down after ~15 min idle
# (WebSocket sessions drop; first connection cold-starts) - acceptable for testing only.
services:
  - type: web
    name: civilised-behaviour-server
    runtime: node
    region: frankfurt
    plan: free
    branch: claude/civilised-behaviour-architecture-jtce2l
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cb/server build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: LOG_LEVEL
        value: info
      # ALLOWED_ORIGINS is a comma list, exact match: the hosted client's origin AND `app://game` (the desktop shell's renderer; docs/DEPLOYMENT.md). Without app:// every desktop
      # connection is refused with 403. The demo is a SEPARATE service with DEMO_MODE=1 (and a client built with VITE_DEMO=1); this blueprint has no demo service.
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: civilised-behaviour
    runtime: static
    branch: claude/civilised-behaviour-architecture-jtce2l
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cb/client build
    staticPublishPath: apps/client/dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
